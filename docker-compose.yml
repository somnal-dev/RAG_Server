version: '3.8'

services:
  # Ollama
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    ports:
      - "11434:11434"
    volumes:
      - ./models:/root/.ollama    # 모델 데이터 저장
    networks:
      - rag-network
    restart: unless-stopped
  # FastAPI 서버
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-server
    env_file:
      - .env
    ports:
      - "${SERVER_PORT:-8000}:8000"
    networks:
      - rag-network
    restart: unless-stopped
networks:
  rag-network:
    external: true